---
name: Generate Vars File
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.LITTLEGODZILLALABORATORY_GITHUB_TOKEN }}
          set-safe-directory: ${{ github.workspace }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: make clean deps && make -f Makefile-extras x-gen-vars-file
      - uses: cliffano/save-changes-action@v2.0.0
        with:
          github_token: ${{ secrets.LITTLEGODZILLALABORATORY_GITHUB_TOKEN }}
          message: Generate vars file with latest Minecraft versions
